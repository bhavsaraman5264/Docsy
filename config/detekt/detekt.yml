naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
complexity:
  CyclomaticComplexMethod:
    allowedComplexity: 30
  NestedBlockDepth:
    allowedDepth: 7
  LongMethod:
    allowedLines: 130
  LongParameterList:
    ignoreAnnotated:
      - Composable
  TooManyFunctions:
    active: false
style:
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated:
      - Composable
      - Preview
    excludes:
      - '**/ui/theme/**'
      - '**/test/**'
      - '**/table/**'
      - '**/text/**'
      - '**/docx/**'
  UnusedPrivateFunction:
    ignoreAnnotated:
      - Preview
