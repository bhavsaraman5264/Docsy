naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
complexity:
  LongMethod:
    ignoreAnnotated:
      - Composable
  CyclomaticComplexMethod:
    ignoreAnnotated:
      - Composable
  LongParameterList:
    ignoreAnnotated:
      - Composable
  TooManyFunctions:
    active: false
style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated:
      - Composable
      - Preview
    excludes:
      - '**/ui/theme/**'
      - '**/test/**'
  UnusedPrivateFunction:
    ignoreAnnotated:
      - Preview
